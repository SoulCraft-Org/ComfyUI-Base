# The gate, on every push and pull request. Same command a maintainer runs before committing:
#   1. comfyui-base.zip matches the working tree   (package.py --check)
#   2. the suite, from the EXTRACTED ZIP           (what a pod actually runs)
#   3. from the repository, only the tests step 2 skipped (they need the repo's own files)
#
# No GPU here, and no provisioned testbed, so the gpu/runpod/comfyui tiers skip themselves by name.
# What remains is every check that does not need hardware, which is the point: a fork gets the real
# gate without renting a machine.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # base_test reaches pytest through `uv run --no-project --python <newest> --with pytest`; a fresh
      # clone has no venv, so without uv on PATH the suite reports "no pytest and no uv" and exits 1.
      # every action is pinned to its release's full commit SHA (the version is the comment); Dependabot
      # (.github/dependabot.yml) opens a PR whenever a newer release exists, so it never stays behind
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # 3.17.1: every test once. The zip's run first (what a pod runs), then from the repository only what it skipped (the
      # repo-tooling tests). The base's suite skips every repo-only check, so this loses nothing (handbook §10, 3.17.1).
      - name: verify
        env:
          VERIFY_SUITE: zip
        run: bash _build/verify.sh
