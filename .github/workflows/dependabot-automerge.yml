# Owner, 2026-10-25: every Dependabot update merges once CI passes, majors too. The organization's shared job
# (SoulCraft-Org/.github/.github/workflows/dependabot-automerge.yml) turns auto-merge on for Dependabot's pull requests;
# the main ruleset's required check (verify) still decides when the merge happens, so a red run never merges.
name: dependabot-automerge

on: pull_request

permissions: {}

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
    uses: SoulCraft-Org/.github/.github/workflows/dependabot-automerge.yml@main
