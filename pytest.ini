[pytest]
addopts = --strict-markers -rs
# Warnings are fixed, never filtered. The kit's own unclosed files once turned every warnings-as-errors
# package suite red; this line is what stops that class of defect being shipped from here again.
filterwarnings = error
markers =
    unit: source contracts on the base library and every package script
    install: fake-pod integration runs of base_main against a throwaway tree
    comfyui: needs the shared testbed and optionally a server this checkout started (testbed.sh --owned)
    runpod: only meaningful on the pod
    gpu: needs the Blackwell GPU
    bare: the base against an environment that supplies nothing (no uv, no cuBLAS, an unreadable lost+found)
