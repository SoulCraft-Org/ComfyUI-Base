# The same secret scan the CI runs (gitleaks), on the staged changes before every commit. Once per clone:
#   pre-commit install
# (pre-commit: https://pre-commit.com). rev is gitleaks' release commit; the version is the comment.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
